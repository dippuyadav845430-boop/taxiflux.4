const normalizePlace = (s) =>
  (s || "")
    .toLowerCase()
    .replace(/[^a-z\s]/g, "")
    .replace(/\s+/g, " ")
    .trim();

const containsPlace = (normalizedStr, key) =>
  new RegExp(`\\b${key.replace(/\s+/g, "\\s+")}\\b`).test(normalizedStr);

// district/alias keys, longest first, so multi-word names win over shorter overlaps
const PLACE_KEYS = [
  ...Object.keys(FARES).map((k) => [k, k]),
  ...Object.entries(FARE_ALIASES).map(([alias, canon]) => [alias, canon]),
].sort((a, b) => b[0].length - a[0].length);

function fareForDistrict(name) {
  const n = normalizePlace(name);
  for (const [key, canon] of PLACE_KEYS) {
    if (containsPlace(n, key)) return FARES[canon] ?? null;
  }
  return null;
}

const isPatna = (name) => containsPlace(normalizePlace(name), "patna");

// Fixed fares only apply to a Patna <-> district route, either direction.
function getFare(from, to) {
  const aIsPatna = isPatna(from);
  const bIsPatna = isPatna(to);
  if (aIsPatna && !bIsPatna) return fareForDistrict(to);
  if (bIsPatna && !aIsPatna) return fareForDistrict(from);
  return null;
}

const toTitle = (key) => key.replace(/\b\w/g, (c) => c.toUpperCase());

// Flat, pre-built list of every "Block, District" (or bare district) suggestion
const SEARCH_INDEX = Object.entries(BLOCKS).flatMap(([districtKey, blocks]) =>
  blocks.map((block) => ({
    label: normalizePlace(block) === districtKey ? block : `${block}, ${toTitle(districtKey)}`,
  }))
);

function filterPlaces(query) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const starts = [];
  const contains = [];
  for (const item of SEARCH_INDEX) {
    const l = item.label.toLowerCase();
    if (l.startsWith(q)) starts.push(item);
    else if (l.includes(q)) contains.push(item);
  }
  return [...starts, ...contains].slice(0, 6);
}

async function hashSecret(str) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf))
      .map((b) => b.toString(16).padStart(2, "0"))
      .join("");
  } catch (e) {
    return str; // demo fallback only — see note in OwnerAuth
  }
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const play = (freq, start, dur) => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g);
      g.connect(ctx.destination);
      o.type = "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + start);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + start + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.02);
    };
    play(880, 0, 0.18);
    play(660, 0.22, 0.18);
    play(880, 0.44, 0.18);
  } catch (e) {
    /* audio unavailable */
  }
  if (navigator.vibrate) navigator.vibrate([300, 120, 300, 120, 300]);
}

// Real shared backend: the "db" capability (claude.use("db")), a document
// store that actually syncs between every device that opens this page —
// unlike window.storage, which only ever worked inside Claude's own chat
// preview and never between a customer's phone and the owner's device.
let _dbPromise = null;
function getDb() {
  if (!_dbPromise) {
    _dbPromise = window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null);
  }
  return _dbPromise;
}

// Our old flat keys ("booking:abc123") map onto db collections/docs:
// everything before the first ":" is the collection, the rest is the doc id.
function keyToRef(db, key) {
  const idx = key.indexOf(":");
  const collection = idx === -1 ? key : key.slice(0, idx);
  const id = idx === -1 ? "_" : key.slice(idx + 1);
  return db.collection(collection).doc(id);
}

async function sset(key, val) {
  try {
    const db = await getDb();
    if (!db) return null;
    await keyToRef(db, key).set(val);
    return true;
  } catch (e) {
    return null;
  }
}
async function sget(key) {
  try {
    const db = await getDb();
    if (!db) return null;
    const snap = await keyToRef(db, key).get();
    return snap.exists ? snap.data() : null;
  } catch (e) {
    return null;
  }
}
async function slist(prefix) {
  try {
    const db = await getDb();
    if (!db) return [];
    const collection = prefix.endsWith(":") ? prefix.slice(0, -1) : prefix;
    const snap = await db.collection(collection).get();
    return snap.docs.map((d) => `${collection}:${d.id}`);
  } catch (e) {
    return [];
  }
}

/* ---------- place input with block/district suggestions ---------- */
function PlaceInput({ label, value, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const suggestions = open ? filterPlaces(value) : [];

  return (
    <div className="cab-field" style={{ position: "relative" }}>
      <label className="cab-label">{label}</label>
      <input
        className="cab-input"
        placeholder={placeholder}
        value={value}
        onChange={(e) => {
          onChange(e.target.value);
          setOpen(true);
        }}
        onFocus={() => setOpen(true)}
        onBlur={() => setTimeout(() => setOpen(false), 120)}
      />
      {suggestions.length > 0 && (
        <div className="cab-suggest">
          {suggestions.map((s) => (
            <div
              key={s.label}
              className="cab-suggest-item"
              onMouseDown={(e) => e.preventDefault()}
              onClick={() => {
                onChange(s.label);
                setOpen(false);
              }}
            >
              {s.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= APP ================= */
function CabApp() {
  const [screen, setScreen] = useState("c-auth"); // c-auth | c-home | d-auth | d-home | o-auth | o-home
  const [toast, setToast] = useState(null);
  const brandTaps = useRef({ count: 0, timer: null });

  const flash = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  };

  const [backendStatus, setBackendStatus] = useState("checking"); // checking | ready | unavailable
  useEffect(() => {
    getDb().then((db) => setBackendStatus(db ? "ready" : "unavailable"));
  }, []);

  const roleLabel = { c: "Customer", d: "Driver", o: "Owner" }[screen[0]];
  const onPublicAuthScreen = screen === "c-auth" || screen === "d-auth";

  // Tap the wordmark 5 times quickly as a second way into owner sign-in,
  // alongside the visible Admin button.
  const handleBrandTap = () => {
    if (!onPublicAuthScreen) return;
    const t = brandTaps.current;
    t.count += 1;
    clearTimeout(t.timer);
    t.timer = setTimeout(() => {
      t.count = 0;
    }, 1500);
    if (t.count >= 5) {
      t.count = 0;
      setScreen("o-auth");
    }
  };

  return (
    <div className="cab-root">
      <style>{styles}</style>
      <div
        className={`cab-shell ${
          screen === "c-auth" || screen === "d-auth" || screen === "o-auth" ? "cab-auth-bg" : ""
        }`}
      >
        {backendStatus === "unavailable" && (
          <div className="cab-backend-warning">
            You need to be signed in to claude.ai for bookings and sign-ups to sync — nothing you do on this
            screen will reach other devices until you sign in and reload.
          </div>
        )}
        <div className="cab-top">
          <div className="cab-brand" onClick={handleBrandTap}>
            Taxi<span>flux</span>
          </div>
          {onPublicAuthScreen && (
            <button className="cab-admin-btn" onClick={() => setScreen("o-auth")}>
              Admin
            </button>
          )}
          {!onPublicAuthScreen && <div className="cab-role-pill">{roleLabel}</div>}
        </div>

        <div className="cab-page" key={screen}>
          {screen === "c-auth" && (
            <CustomerAuth
              onDone={() => setScreen("c-home")}
              onSwitchRole={() => setScreen("d-auth")}
              flash={flash}
            />
          )}
          {screen === "c-home" && <CustomerHome onBack={() => setScreen("c-auth")} flash={flash} />}
          {screen === "d-auth" && (
            <DriverAuth
              onDone={() => setScreen("d-home")}
              onSwitchRole={() => setScreen("c-auth")}
              flash={flash}
            />
          )}
          {screen === "d-home" && <DriverHome onBack={() => setScreen("c-auth")} />}
          {screen === "o-auth" && (
            <OwnerAuth onDone={() => setScreen("o-home")} onBack={() => setScreen("c-auth")} flash={flash} />
          )}
          {screen === "o-home" && <OwnerHome onBack={() => setScreen("c-auth")} flash={flash} />}
        </div>

        {toast && <div className="cab-toast">{toast}</div>}
      </div>
    </div>
  );
}

/* ---------- Shared: phone + OTP block ---------- */
function PhoneOtp({ onVerified }) {
  const [step, setStep] = useState("phone"); // phone | otp
  const [phone, setPhone] = useState("");
  const [otp, setOtp] = useState("");
  const [sentOtp, setSentOtp] = useState("");
  const [err, setErr] = useState("");
  const [shakeKey, setShakeKey] = useState(0);

  const sendOtp = () => {
    if (!/^\d{10}$/.test(phone)) {
      setErr("Enter a valid 10-digit mobile number.");
      setShakeKey((k) => k + 1);
      return;
    }
    setErr("");
    setSentOtp(genOtp());
    setStep("otp");
  };

  const verify = () => {
    if (otp !== sentOtp) {
      setErr("Incorrect code. Try again.");
      setShakeKey((k) => k + 1);
      return;
    }
    onVerified(phone);
  };

  if (step === "phone") {
    return (
      <>
        <div className="cab-field" key={`p-${shakeKey}`}>
          <label className="cab-label">Mobile number</label>
          <input
            className={`cab-input ${err ? "cab-shake" : ""}`}
            placeholder="98765 43210"
            inputMode="numeric"
            maxLength={10}
            value={phone}
            onChange={(e) => setPhone(e.target.value.replace(/\D/g, ""))}
          />
        </div>
        {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
        <button className="cab-btn cab-btn-primary" onClick={sendOtp}>
          Send OTP
        </button>
      </>
    );
  }

  return (
    <>
      <div className="cab-sub" style={{ marginBottom: 12 }}>
        Demo OTP for {phone}: <b style={{ color: "var(--amber)" }}>{sentOtp}</b>
      </div>
      <div className="cab-field" key={`o-${shakeKey}`}>
        <label className="cab-label">Enter OTP</label>
        <input
          className={`cab-input ${err ? "cab-shake" : ""}`}
          placeholder="4-digit code"
          inputMode="numeric"
          maxLength={4}
          value={otp}
          onChange={(e) => setOtp(e.target.value.replace(/\D/g, ""))}
        />
      </div>
      {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
      <button className="cab-btn cab-btn-primary" onClick={verify} disabled={otp.length !== 4}>
        Verify &amp; continue
      </button>
      <div style={{ height: 10 }} />
      <button className="cab-link" onClick={() => setStep("phone")}>
        Change number
      </button>
    </>
  );
}

/* ---------- Customer signup/login ---------- */
function CustomerAuth({ onDone, onSwitchRole, flash }) {
  const [verifiedPhone, setVerifiedPhone] = useState(null);
  const [existing, setExisting] = useState(undefined);
  const [name, setName] = useState("");
  const [email, setEmail] = useState("");

  const handleVerified = async (phone) => {
    const profile = await sget(`customer:${phone}`, true);
    setVerifiedPhone(phone);
    setExisting(profile);
    if (profile) {
      window.__cabCustomer = profile;
      flash(`Welcome back, ${profile.name.split(" ")[0]}`);
      onDone();
    }
  };

  const completeSignup = async () => {
    if (!name.trim() || !/^\S+@\S+\.\S+$/.test(email)) {
      flash("Enter your name and a valid email.");
      return;
    }
    const profile = { mobile: verifiedPhone, name: name.trim(), email: email.trim() };
    const ok = await sset(`customer:${verifiedPhone}`, profile, true);
    if (!ok) {
      flash("Couldn't save this — make sure you're signed in to claude.ai and have edit access to this page, then try again.");
      return;
    }
    window.__cabCustomer = profile;
    flash("Account created.");
    onDone();
  };

  return (
    <div className="cab-body">
      <div className="cab-h1">Ride with Taxiflux</div>
      <div className="cab-sub">Verify your mobile number to book or sign in.</div>

      <div className="cab-glass">
        {!verifiedPhone && <PhoneOtp onVerified={handleVerified} />}
        {verifiedPhone && existing === undefined && <div className="cab-sub">Checking your number…</div>}

        {verifiedPhone && existing === null && (
          <>
            <div className="cab-field">
              <label className="cab-label">Full name</label>
              <input className="cab-input" placeholder="Riya Sharma" value={name} onChange={(e) => setName(e.target.value)} />
            </div>
            <div className="cab-field">
              <label className="cab-label">Email</label>
              <input className="cab-input" placeholder="riya@email.com" value={email} onChange={(e) => setEmail(e.target.value)} />
            </div>
            <button className="cab-btn cab-btn-primary" onClick={completeSignup}>
              Create account
            </button>
          </>
        )}
      </div>

      <div style={{ height: 16 }} />
      <button className="cab-link" onClick={onSwitchRole}>
        Drive with Taxiflux instead →
      </button>
    </div>
  );
}

/* ---------- Customer home / booking ---------- */
function CustomerHome({ onBack, flash }) {
  const profile = window.__cabCustomer;
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const [scheduleMode, setScheduleMode] = useState("now"); // now | later
  const [schedDate, setSchedDate] = useState("");
  const [schedTime, setSchedTime] = useState("");
  const [booking, setBooking] = useState(null);
  const [pendingPay, setPendingPay] = useState(null); // { from, to, fare, advance, scheduledFor }
  const pollRef = useRef(null);
  const todayStr = new Date().toISOString().slice(0, 10);

  const createBooking = async (fromVal, toVal, fareVal, advanceVal, scheduledForVal) => {
    const id = genId();
    const isFuture = scheduledForVal && scheduledForVal > Date.now() + 30000;
    const record = {
      id,
      from: fromVal.trim(),
      to: toVal.trim(),
      fare: fareVal,
      advancePaid: advanceVal ?? null,
      scheduledFor: scheduledForVal || null,
      status: isFuture ? "scheduled" : "searching",
      customerName: profile.name,
      customerMobile: profile.mobile,
      createdAt: Date.now(),
    };
    const ok = await sset(`booking:${id}`, record, true);
    if (!ok) {
      flash("Couldn't send this booking — make sure you're signed in to claude.ai and have edit access to this page, then try again.");
      return;
    }
    setBooking(record);
  };

  const bookRide = async () => {
    if (!from.trim() || !to.trim()) {
      flash("Enter both a pickup and a drop location.");
      return;
    }
    let scheduledFor = null;
    if (scheduleMode === "later") {
      if (!schedDate || !schedTime) {
        flash("Pick a date and time for your ride.");
        return;
      }
      const dt = new Date(`${schedDate}T${schedTime}`);
      if (isNaN(dt.getTime()) || dt.getTime() < Date.now() - 60000) {
        flash("Pick a date and time in the future.");
        return;
      }
      scheduledFor = dt.getTime();
    }
    const fare = getFare(from, to);
    const advance = getAdvanceAmount(fare);
    if (advance) {
      setPendingPay({ from, to, fare, advance, scheduledFor });
      return;
    }
    await createBooking(from, to, fare, null, scheduledFor);
  };

  const confirmAfterPayment = async () => {
    const { from: f, to: t, fare, advance, scheduledFor } = pendingPay;
    setPendingPay(null);
    await createBooking(f, t, fare, advance, scheduledFor);
  };

  useEffect(() => {
    if (!booking || !["searching", "scheduled", "confirmed"].includes(booking.status)) return;
    pollRef.current = setInterval(async () => {
      const latest = await sget(`booking:${booking.id}`, true);
      if (latest && latest.status !== booking.status) {
        setBooking(latest);
        if (latest.status === "confirmed") flash("Your ride has been confirmed!");
        else if (latest.status === "accepted") flash("Driver assigned!");
        else flash("Ride update received.");
      }
    }, 2500);
    return () => clearInterval(pollRef.current);
  }, [booking]);

  const cancelSearch = async () => {
    await sset(`booking:${booking.id}`, { ...booking, status: "cancelled" }, true);
    setBooking(null);
    setFrom("");
    setTo("");
  };

  if (pendingPay) {
    return (
      <div className="cab-body cab-body-black">
        <div className="cab-h1">Confirm your booking</div>
        <div className="cab-sub">
          Pay the advance below to confirm this ride — fare ₹{pendingPay.fare}, route {pendingPay.from} →{" "}
          {pendingPay.to}
          {pendingPay.scheduledFor ? `, scheduled for ${fmtWhen(pendingPay.scheduledFor)}` : ""}
          .
        </div>
        <div className="cab-card cab-card-in" style={{ textAlign: "center" }}>
          <div
            style={{
              display: "inline-block",
              background: "rgba(240,166,58,.14)",
              color: "var(--amber)",
              fontWeight: 700,
              fontSize: 16,
              padding: "8px 16px",
              borderRadius: 10,
              marginBottom: 14,
            }}
          >
            Scan and pay exactly ₹{pendingPay.advance}
          </div>
          <img
            src={UPI_QR_IMAGE}
            alt="UPI QR code"
            style={{ width: "100%", maxWidth: 260, borderRadius: 14, display: "block", margin: "0 auto" }}
          />
          <div style={{ marginTop: 12, color: "var(--muted)", fontSize: 12.5 }}>{UPI_ID}</div>
          <div style={{ color: "var(--muted)", fontSize: 12.5 }}>{UPI_PAYEE_NAME}</div>
          <div style={{ marginTop: 10, color: "var(--muted)", fontSize: 12, lineHeight: 1.5 }}>
            This QR doesn't carry an amount — after scanning, enter ₹{pendingPay.advance} yourself before paying.
          </div>
        </div>
        <button className="cab-btn cab-btn-primary" onClick={confirmAfterPayment}>
          I've paid — confirm booking
        </button>
        <div style={{ height: 12 }} />
        <button className="cab-link" onClick={() => setPendingPay(null)}>
          ← Change trip
        </button>

  return (
    <div className="cab-body cab-body-black">
      <div className="cab-h1">Where to, {profile.name.split(" ")[0]}?</div>
      <div className="cab-card cab-route">

          <div className="cab-dot from" />
          <div className="cab-route-line" />
          <div className="cab-dot to" />
        </div>
        <PlaceInput label="From" value={from} onChange={setFrom} placeholder="Pickup location" />

      <div className="cab-card">
        <div className="cab-segment" style={{ marginBottom: scheduleMode === "later" ? 14 : 0 }}>

/* ---------- Driver signup (registration only — no dispatch on this device) ---------- */
function DriverAuth({ onDone, onSwitchRole, flash }) {
  const [verifiedPhone, setVerifiedPhone] = useState(null);
  const [existing, setExisting] = useState(undefined);
  const [form, setForm] = useState({ name: "", email: "", aadhar: "", license: "", vehicleNumber: "" });
  const [photo, setPhoto] = useState(null);
  const [rc, setRc] = useState(null);

  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  const handleVerified = async (phone) => {
    const profile = await sget(`driver:${phone}`, true);
    setVerifiedPhone(phone);
    setExisting(profile);
    if (profile) {
      window.__cabDriver = profile;
      flash(`Welcome back, ${profile.name.split(" ")[0]}`);
      onDone();
    }
  };

  const readFile = (setter) => (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => setter(reader.result);
    reader.readAsDataURL(file);
  };

  const completeSignup = async () => {
    const { name, email, aadhar, license, vehicleNumber } = form;
    if (!name.trim() || !/^\S+@\S+\.\S+$/.test(email) || aadhar.replace(/\D/g, "").length !== 12 || !license.trim() || !vehicleNumber.trim()) {
      flash("Fill in all fields with a valid email and 12-digit Aadhar number.");
      return;
    }
    // Dispatch-visible profile — this is what the owner sees when assigning a ride. No ID documents here.
    const dispatchProfile = {
      mobile: verifiedPhone,
      name: name.trim(),
      email: email.trim(),
      vehicleNumber: vehicleNumber.trim().toUpperCase(),
    };
    const ok = await sset(`driver:${verifiedPhone}`, dispatchProfile, true);
    if (!ok) {
      flash("Couldn't save this — make sure you're signed in to claude.ai and have edit access to this page, then try again.");
      return;
    }
    // Kept in a separate collection from the dispatch-visible profile above, but on the
    // shared backend this is readable by anyone with edit access to the page, not just
    // this driver — there's no true per-driver privacy without real account-based auth.
    await sset(`driver-kyc:${verifiedPhone}`, {
      aadhar: form.aadhar.trim(),
      license: form.license.trim(),
      hasPhoto: !!photo,
      hasRc: !!rc,
    });
    window.__cabDriver = dispatchProfile;
    flash("Driver account created.");
    onDone();
  };

  return (
    <div className="cab-body">
      <div className="cab-h1">Drive with Taxiflux</div>
      <div className="cab-sub">Verify your mobile number, then register your documents and vehicle. The owner assigns you rides.</div>

      <div className="cab-glass">
        {!verifiedPhone && <PhoneOtp onVerified={handleVerified} />}
        {verifiedPhone && existing === undefined && <div className="cab-sub">Checking your number…</div>}

        {verifiedPhone && existing === null && (
          <>
            <div className="cab-field">
              <label className="cab-label">Full name</label>
              <input className="cab-input" placeholder="Arjun Verma" value={form.name} onChange={set("name")} />
            </div>
            <div className="cab-field">
              <label className="cab-label">Email</label>
              <input className="cab-input" placeholder="arjun@email.com" value={form.email} onChange={set("email")} />
            </div>
            <div className="cab-field">
              <label className="cab-label">Aadhar number</label>
              <input
                className="cab-input"
                placeholder="12-digit Aadhar"
                inputMode="numeric"
                maxLength={12}
                value={form.aadhar}
                onChange={(e) => setForm({ ...form, aadhar: e.target.value.replace(/\D/g, "") })}
              />
            </div>
            <div className="cab-field">
              <label className="cab-label">Driving licence number</label>
              <input className="cab-input" placeholder="DL number" value={form.license} onChange={set("license")} />
            </div>
            <div className="cab-field">
              <label className="cab-label">Vehicle number</label>
              <input className="cab-input" placeholder="e.g. RJ14 AB 1234" value={form.vehicleNumber} onChange={set("vehicleNumber")} />
            </div>
            <div className="cab-field cab-photo-row">
              <label className="cab-photo-box">
                {photo ? <img src={photo} alt="Driver" /> : "Upload photo"}
                <input type="file" accept="image/*" style={{ display: "none" }} onChange={readFile(setPhoto)} />
              </label>
              <label className="cab-photo-box">
                {rc ? <img src={rc} alt="RC" /> : "Upload vehicle RC"}
                <input type="file" accept="image/*" style={{ display: "none" }} onChange={readFile(setRc)} />
              </label>
            </div>
            <button className="cab-btn cab-btn-primary" onClick={completeSignup}>
              Submit &amp; create account
            </button>
          </>
        )}
      </div>

      <div style={{ height: 16 }} />
      <button className="cab-link" onClick={onSwitchRole}>
        Book a ride instead →
      </button>
    </div>
  );
}

/* ---------- Owner login (this is "my device") ---------- */
function OwnerAuth({ onDone, onBack, flash }) {
  const [step, setStep] = useState("creds"); // creds | otp | forgot-identify | forgot-otp | forgot-reset
  const [email, setEmail] = useState("");
  const [mobile, setMobile] = useState("");
  const [password, setPassword] = useState("");
  const [newPassword, setNewPassword] = useState("");
  const [err, setErr] = useState("");
  const [shakeKey, setShakeKey] = useState(0);
  const [isNewAccount, setIsNewAccount] = useState(false);
  const [sentOtp, setSentOtp] = useState("");
  const [otp, setOtp] = useState("");

  const fail = (msg) => {
    setErr(msg);
    setShakeKey((k) => k + 1);
  };

  const submitCreds = async () => {
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Enter a valid email.");
    if (!/^\d{10}$/.test(mobile)) return fail("Enter a valid 10-digit mobile number.");
    if (password.length < 6) return fail("Password must be at least 6 characters.");

    const existing = await sget(`owner:${mobile}`, true);
    if (existing) {
      const hash = await hashSecret(password);
      if (existing.email !== email.trim() || existing.passwordHash !== hash) {
        return fail("Email or password doesn't match this mobile number.");
      }
      setIsNewAccount(false);
    } else {
      setIsNewAccount(true);
    }
    setErr("");
    setSentOtp(genOtp());
    setStep("otp");
  };

  const verifyOtp = async () => {
    if (otp !== sentOtp) return fail("Incorrect code. Try again.");
    if (isNewAccount) {
      const passwordHash = await hashSecret(password);
      await sset(`owner:${mobile}`, { mobile, email: email.trim(), passwordHash }, true);
    }
    window.__cabOwner = { mobile, email: email.trim() };
    flash(isNewAccount ? "Owner account created." : "Logged in as owner.");
    onDone();
  };

  const submitForgotIdentify = async () => {
    if (!/^\S+@\S+\.\S+$/.test(email)) return fail("Enter a valid email.");
    if (!/^\d{10}$/.test(mobile)) return fail("Enter a valid 10-digit mobile number.");
    const existing = await sget(`owner:${mobile}`, true);
    if (!existing || existing.email !== email.trim()) {
      return fail("No owner account matches that email and mobile number.");
    }
    setErr("");
    setSentOtp(genOtp());
    setOtp("");
    setStep("forgot-otp");
  };

  const verifyForgotOtp = () => {
    if (otp !== sentOtp) return fail("Incorrect code. Try again.");
    setErr("");
    setNewPassword("");
    setStep("forgot-reset");
  };

  const submitNewPassword = async () => {
    if (newPassword.length < 6) return fail("Password must be at least 6 characters.");
    const passwordHash = await hashSecret(newPassword);
    await sset(`owner:${mobile}`, { mobile, email: email.trim(), passwordHash }, true);
    window.__cabOwner = { mobile, email: email.trim() };
    flash("Password reset — logged in as owner.");
    onDone();
  };

  return (
    <div className="cab-body">
      <div className="cab-h1">Owner sign-in</div>
      <div className="cab-sub">
        Sign in with your email, mobile number and password, then confirm with the OTP sent to that number —
        this is the device that will pop up and ring for every new booking.
      </div>

      <div className="cab-glass">
      {step === "creds" && (
        <>
          <div className="cab-field" key={`e-${shakeKey}`}>
            <label className="cab-label">Email</label>
            <input
              className={`cab-input ${err ? "cab-shake" : ""}`}
              placeholder="owner@taxiflux.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
            />
          </div>
          <div className="cab-field">
            <label className="cab-label">Mobile number</label>
            <input
              className="cab-input"
              placeholder="98765 43210"
              inputMode="numeric"
              maxLength={10}
              value={mobile}
              onChange={(e) => setMobile(e.target.value.replace(/\D/g, ""))}
            />
          </div>
          <div className="cab-field">
            <label className="cab-label">Password</label>
            <input
              className="cab-input"
              type="password"
              placeholder="At least 6 characters"
              value={password}
              onChange={(e) => setPassword(e.target.value)}
            />
          </div>
          {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
          <div className="cab-note" style={{ marginTop: 0, marginBottom: 14 }}>
            New mobile number? This creates your owner account with the details above.
          </div>
          <button className="cab-btn cab-btn-primary" onClick={submitCreds}>
            Continue
          </button>
          <div style={{ height: 12 }} />
          <button
            className="cab-link"
            onClick={() => {
              setErr("");
              setPassword("");
              setStep("forgot-identify");
            }}
          >
            Forgot password?
          </button>
        </>
      )}

      {step === "otp" && (
        <>
          <div className="cab-sub" style={{ marginBottom: 12 }}>
            Demo OTP for {mobile}: <b style={{ color: "var(--amber)" }}>{sentOtp}</b>
          </div>
          <div className="cab-field" key={`o-${shakeKey}`}>
            <label className="cab-label">Enter OTP</label>
            <input
              className={`cab-input ${err ? "cab-shake" : ""}`}
              placeholder="4-digit code"
              inputMode="numeric"
              maxLength={4}
              value={otp}
              onChange={(e) => setOtp(e.target.value.replace(/\D/g, ""))}
            />
          </div>
          {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
          <button className="cab-btn cab-btn-primary" onClick={verifyOtp} disabled={otp.length !== 4}>
            Verify &amp; sign in
          </button>
          <div style={{ height: 10 }} />
          <button className="cab-link" onClick={() => setStep("creds")}>
            ← Change details
          </button>
        </>
      )}

      {step === "forgot-identify" && (
        <>
          <div className="cab-sub" style={{ marginBottom: 14 }}>
            Enter the email and mobile number on the owner account — we'll send an OTP to confirm it's you.
          </div>
          <div className="cab-field" key={`fe-${shakeKey}`}>
            <label className="cab-label">Email</label>
            <input
              className={`cab-input ${err ? "cab-shake" : ""}`}
              placeholder="owner@taxiflux.com"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
            />
          </div>
          <div className="cab-field">
            <label className="cab-label">Mobile number</label>
            <input
              className="cab-input"
              placeholder="98765 43210"
              inputMode="numeric"
              maxLength={10}
              value={mobile}
              onChange={(e) => setMobile(e.target.value.replace(/\D/g, ""))}
            />
          </div>
          {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
          <button className="cab-btn cab-btn-primary" onClick={submitForgotIdentify}>
            Send reset OTP
          </button>
          <div style={{ height: 10 }} />
          <button
            className="cab-link"
            onClick={() => {
              setErr("");
              setStep("creds");
            }}
          >
            ← Back to sign in
          </button>
        </>
      )}

      {step === "forgot-otp" && (
        <>
          <div className="cab-sub" style={{ marginBottom: 12 }}>
            Demo OTP for {mobile}: <b style={{ color: "var(--amber)" }}>{sentOtp}</b>
          </div>
          <div className="cab-field" key={`fo-${shakeKey}`}>
            <label className="cab-label">Enter OTP</label>
            <input
              className={`cab-input ${err ? "cab-shake" : ""}`}
              placeholder="4-digit code"
              inputMode="numeric"
              maxLength={4}
              value={otp}
              onChange={(e) => setOtp(e.target.value.replace(/\D/g, ""))}
            />
          </div>
          {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
          <button className="cab-btn cab-btn-primary" onClick={verifyForgotOtp} disabled={otp.length !== 4}>
            Verify code
          </button>
          <div style={{ height: 10 }} />
          <button className="cab-link" onClick={() => setStep("forgot-identify")}>
            ← Change details
          </button>
        </>
      )}

      {step === "forgot-reset" && (
        <>
          <div className="cab-sub" style={{ marginBottom: 14 }}>
            Verified. Set a new password for this owner account.
          </div>
          <div className="cab-field" key={`fp-${shakeKey}`}>
            <label className="cab-label">New password</label>
            <input
              className={`cab-input ${err ? "cab-shake" : ""}`}
              type="password"
              placeholder="At least 6 characters"
              value={newPassword}
              onChange={(e) => setNewPassword(e.target.value)}
            />
          </div>
          {err && <div style={{ color: "var(--red)", fontSize: 13, marginBottom: 10 }}>{err}</div>}
          <button className="cab-btn cab-btn-primary" onClick={submitNewPassword}>
            Reset password &amp; sign in
          </button>
        </>
      )}
      </div>

      <div style={{ height: 16 }} />
      <button className="cab-link" onClick={onBack}>
        ← Back
      </button>
    </div>
  );
}

function OwnerHome({ onBack, flash }) {
  const [incoming, setIncoming] = useState(null);
  const [drivers, setDrivers] = useState([]);
  const [pendingRides, setPendingRides] = useState([]);
  const [confirmedRides, setConfirmedRides] = useState([]);
  const [activeRides, setActiveRides] = useState([]);
  const [allDrivers, setAllDrivers] = useState([]);
  const [view, setView] = useState("rides"); // rides | fleet | orders
  const todayStr = new Date().toISOString().slice(0, 10);
  const [orderDate, setOrderDate] = useState(todayStr);
  const [orders, setOrders] = useState([]);
  const [ordersLoading, setOrdersLoading] = useState(false);
  const seen = useRef(new Set());
  const busy = useRef(false);

  const loadActive = useCallback(async () => {
    const keys = await slist("booking:", true);
    const recs = (await Promise.all(keys.map((k) => sget(k, true)))).filter(Boolean);
    setPendingRides(recs.filter((r) => r.status === "searching" || r.status === "scheduled").sort((a, b) => a.createdAt - b.createdAt));
    setConfirmedRides(recs.filter((r) => r.status === "confirmed").sort((a, b) => a.createdAt - b.createdAt));
    setActiveRides(recs.filter((r) => r.status === "accepted").sort((a, b) => b.createdAt - a.createdAt));
  }, []);

  const loadDrivers = useCallback(async () => {
    const keys = await slist("driver:", true);
    const list = (await Promise.all(keys.map((k) => sget(k, true)))).filter(Boolean);
    setAllDrivers(list.sort((a, b) => a.name.localeCompare(b.name)));
  }, []);

  const loadOrders = useCallback(async (date) => {
    setOrdersLoading(true);
    const keys = await slist("booking:", true);
    const recs = (await Promise.all(keys.map((k) => sget(k, true)))).filter(Boolean);
    const localDate = (ms) => {
      const d = new Date(ms);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };
    const matched = recs.filter((r) => localDate(r.scheduledFor || r.createdAt) === date);
    setOrders(matched.sort((a, b) => (a.scheduledFor || a.createdAt) - (b.scheduledFor || b.createdAt)));
    setOrdersLoading(false);
  }, []);

  useEffect(() => {
    if (view === "orders") loadOrders(orderDate);
  }, [view, orderDate, loadOrders]);

  const scan = useCallback(async () => {
    if (busy.current || incoming) return;
    busy.current = true;
    const keys = await slist("booking:", true);
    for (const k of keys) {
      if (seen.current.has(k)) continue;
      const rec = await sget(k, true);
      if (!rec) {
        seen.current.add(k);
        continue;
      }
      // New requests and newly booked scheduled rides both need the owner's
      // decision straight away, so both pop up and ring the moment they're booked.
      if (rec.status === "searching" || rec.status === "scheduled") {
        seen.current.add(k);
        setIncoming(rec);
        beep();
        break;
      }
      seen.current.add(k);
    }
    busy.current = false;
    loadActive();
    loadDrivers();
  }, [incoming, loadActive, loadDrivers]);

  useEffect(() => {
    const t = setInterval(scan, 3000);
    scan();
    return () => clearInterval(t);
  }, [scan]);

  const openAssign = async () => {
    const keys = await slist("driver:", true);
    const list = (await Promise.all(keys.map((k) => sget(k, true)))).filter(Boolean);
    setDrivers(list);
  };

  useEffect(() => {
    if (incoming) openAssign();
  }, [incoming]);

  const stillOpen = async () => {
    const latest = await sget(`booking:${incoming.id}`);
    if (!latest || latest.status !== "cancelled") return true;
    flash("The customer cancelled this ride.");
    setIncoming(null);
    loadActive();
    return false;
  };

  const assign = async (driver) => {
    if (!(await stillOpen())) return;
    const updated = {
      ...incoming,
      status: "accepted",
      driverName: driver.name,
      driverMobile: driver.mobile,
      vehicleNumber: driver.vehicleNumber,
    };
    const ok = await sset(`booking:${incoming.id}`, updated, true);
    if (!ok) {
      flash("Couldn't save the assignment — try again.");
      return;
    }
    setIncoming(null);
    flash(`Assigned ${driver.name} to the ride.`);
    loadActive();
  };

  // Accepting confirms the ride to the customer straight away; a driver can be
  // assigned now or later from the Rides tab.
  const acceptRide = async () => {
    if (!(await stillOpen())) return;
    const ok = await sset(`booking:${incoming.id}`, { ...incoming, status: "confirmed" }, true);
    if (!ok) {
      flash("Couldn't confirm this ride — try again.");
      return;
    }
    setIncoming(null);
    flash("Ride confirmed — the customer can see it now.");
    loadActive();
  };

  const decline = async () => {
    await sset(`booking:${incoming.id}`, { ...incoming, status: "cancelled" }, true);
    setIncoming(null);
  };

  const onDutyMobiles = new Set(activeRides.map((r) => r.driverMobile));
  const onDutyDrivers = allDrivers.filter((d) => onDutyMobiles.has(d.mobile));

  return (
    <div className="cab-body">
      <div className="cab-h1">Dispatch</div>
      <div className="cab-sub">
        Keep this open on your device — new bookings pop up here with a ring, and you assign the driver.
      </div>

      {view === "rides" && (
        <>
          {pendingRides.length === 0 && confirmedRides.length === 0 && activeRides.length === 0 && (
            <div className="cab-card">
              <div style={{ color: "var(--muted)", fontSize: 13.5 }}>No active rides right now. Waiting for bookings…</div>
            </div>
          )}

          {pendingRides.map((r) => (
            <div
              className="cab-card cab-card-in cab-ring-pulse"
              key={r.id}
              style={{ cursor: "pointer" }}
              onClick={() => setIncoming(r)}
            >
              <div className="cab-status-badge cab-status-searching" style={{ marginBottom: 10 }}>
                {r.status === "scheduled" ? "NEW SCHEDULED RIDE" : "NEW REQUEST"}
              </div>
              <div style={{ fontSize: 14, marginBottom: 4 }}>
                {r.from} → {r.to} {r.fare != null && <span style={{ color: "var(--amber)" }}>· ₹{r.fare}</span>}
              </div>
              <PickupLine ride={r} />
              <div style={{ color: "var(--muted)", fontSize: 13 }}>
                {r.customerName} ({r.customerMobile})
              </div>
              <div style={{ color: "var(--amber)", fontSize: 12.5, marginTop: 6, fontWeight: 700 }}>Tap to accept or decline →</div>
            </div>
          ))}

          {confirmedRides.map((r) => (
            <div className="cab-card cab-card-in" key={r.id} style={{ cursor: "pointer" }} onClick={() => setIncoming(r)}>
              <div className="cab-status-badge cab-status-confirmed" style={{ marginBottom: 10 }}>
                CONFIRMED
              </div>
              <div style={{ fontSize: 14, marginBottom: 4 }}>
                {r.from} → {r.to} {r.fare != null && <span style={{ color: "var(--amber)" }}>· ₹{r.fare}</span>}
              </div>
              <PickupLine ride={r} />
              <div style={{ color: "var(--muted)", fontSize: 13 }}>
                {r.customerName} ({r.customerMobile})
              </div>
              <div style={{ color: "var(--amber)", fontSize: 12.5, marginTop: 6, fontWeight: 700 }}>Tap to assign a driver →</div>
            </div>
          ))}

          {activeRides.map((r) => (
            <div className="cab-card cab-card-in" key={r.id}>
              <div className="cab-status-badge cab-status-accepted" style={{ marginBottom: 10 }}>
                IN PROGRESS
              </div>
              <div style={{ fontSize: 14, marginBottom: 4 }}>
                {r.from} → {r.to} {r.fare != null && <span style={{ color: "var(--amber)" }}>· ₹{r.fare}</span>}
              </div>
              <PickupLine ride={r} />
              <div style={{ color: "var(--muted)", fontSize: 13 }}>
                {r.customerName} ({r.customerMobile}) · driver {r.driverName} · {r.vehicleNumber}
              </div>
            </div>
          ))}
        </>
      )}

      {view === "fleet" && (
        <>
          <div className="cab-card cab-card-in">
            <div className="cab-label">On duty now ({onDutyDrivers.length})</div>
            {onDutyDrivers.length === 0 && (
              <div style={{ color: "var(--muted)", fontSize: 13.5, padding: "6px 0" }}>No drivers are on a ride right now.</div>
            )}
            {onDutyDrivers.map((d) => (
              <div className="cab-driver-row" key={d.mobile}>
                <div>
                  <span className="cab-duty-dot on" />
                  <b style={{ fontSize: 14 }}>{d.name}</b>
                </div>
                <span style={{ color: "var(--muted)", fontSize: 13 }}>{d.vehicleNumber}</span>
              </div>
            ))}
          </div>

          <div className="cab-card cab-card-in" style={{ animationDelay: "70ms" }}>
            <div className="cab-label">All registered drivers ({allDrivers.length})</div>
            {allDrivers.length === 0 && (
              <div style={{ color: "var(--muted)", fontSize: 13.5, padding: "6px 0" }}>No drivers have registered yet.</div>
            )}
            {allDrivers.map((d) => (
              <div className="cab-driver-row" key={d.mobile}>
                <div>
                  <span className={`cab-duty-dot ${onDutyMobiles.has(d.mobile) ? "on" : "off"}`} />
                  <b style={{ fontSize: 14 }}>{d.name}</b>
                </div>
                <span style={{ color: "var(--muted)", fontSize: 13 }}>
                  {d.vehicleNumber} · {d.mobile}
                </span>
              </div>
            ))}
          </div>
        </>
      )}

      {view === "orders" && (
        <>
          <input
            type="date"
            className="cab-date-input"
            value={orderDate}
            max={todayStr}
            onChange={(e) => setOrderDate(e.target.value)}
          />
          <div className="cab-card cab-card-in">
            <div className="cab-label">
              Orders on{" "}
              {new Date(orderDate + "T00:00:00").toLocaleDateString(undefined, {
                day: "numeric",
                month: "short",
                year: "numeric",
              })}{" "}
              ({orders.length})
            </div>
            {ordersLoading && <div style={{ color: "var(--muted)", fontSize: 13.5, padding: "6px 0" }}>Loading…</div>}
            {!ordersLoading && orders.length === 0 && (
              <div style={{ color: "var(--muted)", fontSize: 13.5, padding: "6px 0" }}>No bookings on this date.</div>
            )}
            {!ordersLoading &&
              orders.map((o) => (
                <div className="cab-order-row" key={o.id}>
                  <div className="cab-ride-row" style={{ marginBottom: 6 }}>
                    <span className={`cab-status-badge cab-status-${o.status}`}>{o.status.toUpperCase()}</span>
                    <span style={{ color: "var(--muted)", fontSize: 12 }}>
                      {o.scheduledFor ? "pickup " : ""}
                      {new Date(o.scheduledFor || o.createdAt).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}
                    </span>
                  </div>
                  <div style={{ fontSize: 14, marginBottom: 3 }}>
                    {o.from} → {o.to} {o.fare != null && <span style={{ color: "var(--amber)" }}>· ₹{o.fare}</span>}
                  </div>
                  <div style={{ color: "var(--muted)", fontSize: 12.5 }}>
                    {o.customerName} ({o.customerMobile})
                    {o.driverName ? ` · driver ${o.driverName} · ${o.vehicleNumber}` : ""}
                  </div>
                </div>
              ))}
          </div>
        </>
      )}

      <div style={{ height: 16 }} />
      <button className="cab-link" onClick={onBack}>
        ← Switch account
      </button>

      <div className="cab-owner-tabbar">
        <button className={`cab-owner-tab ${view === "rides" ? "active" : ""}`} onClick={() => setView("rides")}>
          Rides
        </button>
        <button className={`cab-owner-tab ${view === "fleet" ? "active" : ""}`} onClick={() => setView("fleet")}>
          Drivers
        </button>
        <button className={`cab-owner-tab ${view === "orders" ? "active" : ""}`} onClick={() => setView("orders")}>
          Orders
        </button>
      </div>

      {incoming && (
        <div className="cab-overlay">
          <div className="cab-sheet">
            <div className="cab-status-badge cab-status-searching cab-ring-pulse" style={{ marginBottom: 10 }}>
              {incoming.status === "confirmed"
                ? "CONFIRMED — ASSIGN A DRIVER"
                : incoming.status === "scheduled"
                ? "NEW SCHEDULED RIDE"
                : "NEW RIDE REQUEST"}
            </div>
            <div className="cab-route" style={{ marginBottom: 16 }}>
              <div className="cab-route-rail">
                <div className="cab-dot from" />
                <div className="cab-route-line" />
                <div className="cab-dot to" />
              </div>
              <div style={{ marginBottom: 22 }}>
                <div className="cab-label">From</div>
                <div>{incoming.from}</div>
              </div>
              <div>
                <div className="cab-label">To</div>
                <div>{incoming.to}</div>
              </div>
            </div>
            {incoming.scheduledFor && (
              <div style={{ marginBottom: 14 }}>
                <div className="cab-label">Pickup time</div>
                <div style={{ fontWeight: 700 }}>{fmtWhen(incoming.scheduledFor)}</div>
                <div style={{ color: "var(--muted)", fontSize: 12, marginTop: 2 }}>
                  Booked {fmtWhen(incoming.createdAt)}
                </div>
              </div>
            )}
            <div className="cab-label">Customer</div>
            <div style={{ fontWeight: 700, marginBottom: 2 }}>{incoming.customerName}</div>
            <div style={{ color: "var(--muted)", fontSize: 13.5, marginBottom: incoming.fare != null || incoming.advancePaid != null ? 4 : 16 }}>
              {incoming.customerMobile}
            </div>
            {(incoming.fare != null || incoming.advancePaid != null) && (
              <div style={{ marginBottom: 16 }}>
                {incoming.fare != null && (
                  <div style={{ color: "var(--amber)", fontSize: 15, fontWeight: 700 }}>Fixed fare: ₹{incoming.fare}</div>
                )}
                {incoming.advancePaid != null && (
                  <div style={{ color: "var(--muted)", fontSize: 12.5, marginTop: 2 }}>
                    ✓ ₹{incoming.advancePaid} advance collected via UPI
                  </div>
                )}
              </div>
            )}

            <div className="cab-label">Assign a driver</div>
            {drivers.length === 0 && (
              <div style={{ color: "var(--muted)", fontSize: 13.5, marginBottom: 14 }}>
                No registered drivers yet — you can still accept now and assign one later.
              </div>
            )}
            {drivers.map((d, i) => (
              <div className="cab-driver-pick cab-card-in" style={{ animationDelay: `${i * 60}ms` }} key={d.mobile} onClick={() => assign(d)}>
                <div>
                  <div style={{ fontWeight: 700, fontSize: 14 }}>{d.name}</div>
                  <div style={{ color: "var(--muted)", fontSize: 12.5 }}>{d.vehicleNumber}</div>
                </div>
                <button className="cab-btn cab-btn-primary" style={{ width: "auto", padding: "8px 14px" }}>
                  Assign
                </button>
              </div>
            ))}

            <div style={{ height: 14 }} />
            {(incoming.status === "searching" || incoming.status === "scheduled") && (
              <>
                <button className="cab-btn cab-btn-primary" onClick={acceptRide}>
                  Accept ride
                </button>
                <div style={{ height: 10 }} />
              </>
            )}
            <button className="cab-btn cab-btn-ghost" onClick={decline}>
              {incoming.status === "confirmed" ? "Cancel this ride" : "Decline this ride"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<CabApp />);
</script>
</body>
</html>
